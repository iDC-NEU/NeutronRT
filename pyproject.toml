[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.setuptools.package-data]
"lib.graph" = ["csrc/*.cpp"]
"lib.rpc" = ["*.proto"]

[project]
name = "neutronrt"
version = "0.1.0"
description = "Real-time GNN inference with distributed caching"
requires-python = ">=3.11"
dependencies = [
	"torch>=2.4.0",
	"dgl>=2.4.0",
	"grpcio>=1.75",
	"grpcio-tools>=1.75",
	"protobuf>=6.32",
	"numpy>=2.3",
	"psutil>=7.1",
	"pydantic>=2.11",
	"PyYAML>=6.0",
	"ogb>=1.3",
	"scikit-learn>=1.7",
	"networkx>=3.3",
	"attrs>=24.2",
	"typer>=0.15",
	"pandas>=2.3",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"ruff>=0.5",
	"mypy>=1.10",
	"pre-commit>=3.8",
]

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = ["W191"]  # project uses tabs for indentation

[tool.ruff.format]
indent-style = "tab"

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "*.egg", "__pycache__", "venv"]
markers = ["host: requires real sockets, process groups, or managed worker processes"]
