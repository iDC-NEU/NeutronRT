name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check lib/ benchmarks/ scripts/ tests/
      - run: ruff format --check lib/ benchmarks/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: graph
          auto-activate-base: false
          python-version: "3.12"
      - name: Install CPU-only PyTorch and matching DGL
        run: |
          conda install --yes 'dglteam/label/th24_cpu::dgl=2.4.0.th24.cpu=py312_0'
          python -m pip install 'torch==2.4.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[dev]' grpcio-tools==1.75.1
      - name: Verify CPU graph backends
        run: |
          python - <<'PY'
          import dgl
          import torch

          print(f"PyTorch {torch.__version__}, DGL {dgl.__version__}")
          assert torch.__version__ == "2.4.0+cpu"
          assert dgl.__version__ == "2.4.0"
          assert dgl.graph(([0], [1])).num_edges() == 1
          PY
      - name: Verify generated RPC stubs
        run: |
          python -m scripts.generate_inference_proto
          git diff --exit-code -- lib/rpc/inference_pb2.py lib/rpc/inference_pb2.pyi lib/rpc/inference_pb2_grpc.py
      - name: Run tests
        run: python -m pytest tests/ -v
