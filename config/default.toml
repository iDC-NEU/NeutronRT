[env]
    MASTER_ADDR = "127.0.0.1"
    MASTER_PORT = 29500
    OMP_NUM_THREADS = 20

[model]
    # gin sage
    # gcn
    # gat
    name = "sage"
    num_layers = 1
    fanouts = [-1, -1]
    num_hiddens = 128
    layerwise = true

[dataset]
    # ogbn-arxiv ogbn-products reddit
    # ogbn-papers100M twitter friendster
    name = "twitter"
    in_memory = false


[file]
    root = "/home/hdd/dataset"
    logdir = "./logs"


[dist]
    world_size = 1

[shared]
    shm_name = "shared_graph"


[parameter]
    method = 'inc'
    bs_update = 100_000
    num_snapshots = 10